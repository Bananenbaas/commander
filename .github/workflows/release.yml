name: Release

# A tag such as v0.1.0 or v0.1.0-beta.1 builds the executables, writes their
# SHA-256 checksums, submits them to VirusTotal and publishes a GitHub
# release. A tag with a hyphen (v0.1.0-beta.1) becomes a pre-release.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"

      - name: Test
        working-directory: screen
        run: |
          go vet ./...
          go test ./...

      - name: Build
        working-directory: screen
        run: |
          mkdir -p ../dist
          ldflags="-X main.version=${TAG}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${ldflags}" \
            -o ../dist/kb7screen-windows-amd64.exe ./cmd/kb7screen
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${ldflags} -H=windowsgui" \
            -o ../dist/commander-windows-amd64.exe ./cmd/commander
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${ldflags}" \
            -o ../dist/kb7screen-linux-amd64 ./cmd/kb7screen
          # The title font is built into the executables; its licence ships
          # with them, as the SIL Open Font License asks.
          cp ../LICENSE ../dist/LICENSE.txt
          cp internal/picture/fonts/OFL.txt ../dist/OFL-BarlowCondensed.txt
          cp THIRD-PARTY-NOTICES.txt ../dist/THIRD-PARTY-NOTICES.txt

      - name: Checksums
        working-directory: dist
        run: sha256sum kb7screen-windows-amd64.exe commander-windows-amd64.exe kb7screen-linux-amd64 > SHA256SUMS.txt

      - name: Submit to VirusTotal
        working-directory: dist
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL }}
        run: |
          : > ../virustotal.md
          if [ -z "${VT_API_KEY}" ]; then
            echo "No VIRUSTOTAL secret; skipping VirusTotal."
            exit 0
          fi
          first=1
          while read -r sum name; do
            # The free API allows 4 requests a minute.
            [ "$first" = 1 ] || sleep 20
            first=0
            curl --fail --silent --show-error \
              --header "x-apikey: ${VT_API_KEY}" \
              --form "file=@${name}" \
              https://www.virustotal.com/api/v3/files > /dev/null
            echo "- [\`${name}\`](https://www.virustotal.com/gui/file/${sum})" >> ../virustotal.md
          done < SHA256SUMS.txt

      - name: Release notes
        run: |
          version="${TAG#v}"
          {
            awk -v head="## [${version}]" '
              index($0, head) == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
            echo
            echo "## Downloads"
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            while read -r sum name; do
              echo "| \`${name}\` | \`${sum}\` |"
            done < dist/SHA256SUMS.txt
            echo
            echo "The executables are not code-signed, so Windows SmartScreen may warn"
            echo "before the first start. Check a download against its SHA-256:"
            echo "\`Get-FileHash <file> -Algorithm SHA256\` (PowerShell) or \`sha256sum <file>\`."
            echo
            echo "\`LICENSE.txt\` is the licence of this software (GPL-2.0-or-later);"
            echo "\`OFL-BarlowCondensed.txt\` is the licence of the title font built into the executables;"
            echo "\`THIRD-PARTY-NOTICES.txt\` has the licences of the libraries built into them."
            if [ -s virustotal.md ]; then
              echo
              echo "## VirusTotal"
              echo
              echo "Scans of these exact files (results can take a few minutes to appear):"
              echo
              cat virustotal.md
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${TAG}" in *-*) pre="--prerelease" ;; esac
          gh release create "${TAG}" ${pre} --verify-tag \
            --title "${TAG}" --notes-file notes.md \
            dist/kb7screen-windows-amd64.exe dist/commander-windows-amd64.exe \
            dist/kb7screen-linux-amd64 dist/SHA256SUMS.txt dist/LICENSE.txt dist/OFL-BarlowCondensed.txt dist/THIRD-PARTY-NOTICES.txt
